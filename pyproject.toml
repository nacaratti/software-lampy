[project]
name = "fibersim"
version = "0.1.0"
description = "A fiber simulation library modeled after RP Fiber Power"
authors = [
    { name = "Davi Nacaratti" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "pydantic>=2.6.0",
    "pint>=0.23",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
]
backend = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "anyio>=4.4.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fibersim"]
